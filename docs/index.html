<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poker Odds</title>
<meta name="description" content="Texas Hold'em preflop win probability — a native Android app." />
<style>
  :root{
    --bg:#0b0f0d; --fg:#e9edeb; --muted:#8b968f;
    --gold:#f4c542; --line:rgba(233,237,235,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(900px 500px at 50% -10%,#12331f55,transparent 60%),var(--bg);
    color:var(--fg);
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:24px;line-height:1.55;
  }
  .card{width:100%;max-width:440px;text-align:center}
  .head{display:flex;align-items:center;justify-content:center;gap:12px}
  h1{font-size:40px;margin:0;letter-spacing:-.02em;font-weight:800}
  h1 .suit{color:var(--gold)}
  .gh{display:inline-flex;color:var(--muted);transition:color .15s ease}
  .gh:hover{color:var(--fg)}
  .gh svg{width:26px;height:26px;fill:currentColor;display:block}
  p.desc{color:var(--muted);font-size:17px;margin:16px 0 32px}
  .btn{
    display:inline-block;text-decoration:none;font-weight:700;font-size:17px;
    background:var(--gold);color:#141414;padding:15px 34px;border-radius:12px;
    transition:transform .12s ease,box-shadow .12s ease;
    box-shadow:0 10px 30px #f4c54222;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px #f4c54233}
  .sub{color:var(--muted);font-size:13px;margin-top:16px}
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <h1>Poker <span class="suit">Odds</span></h1>
      <a class="gh" href="https://github.com/vtlinh/Poker-Stats" aria-label="View source on GitHub" title="View on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
    <p class="desc">Your chance of winning a Texas&nbsp;Hold'em hand before the flop — pick your two cards and the table size.</p>
    <a class="btn" href="https://github.com/vtlinh/Poker-Stats/releases/latest/download/poker-odds.apk">Download APK</a>
    <p class="sub">Signed release · Android 8.0+</p>
  </main>
</body>
</html>
