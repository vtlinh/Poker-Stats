<html lang="en">
<head>

<meta name="theme-color" content="#141c18" />
<title>Poker Pro</title>

<style>
  :root{
    --bg:#141c18; --fg:#eaf1ed; --muted:#94a39b; --accent:#e6b63c;
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1100px 600px at 50% -10%, #23402e 0%, var(--bg) 60%);
    color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:24px;
  }
  main{text-align:center;max-width:460px}
  .logo-link{display:inline-block;line-height:0;margin-bottom:28px}
  .logo{
    width:96px;height:96px;border-radius:24px;display:block;
    box-shadow:0 12px 40px rgba(230,182,60,.32);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .logo-link:hover .logo{transform:translateY(-3px);box-shadow:0 16px 48px rgba(230,182,60,.45)}
  .logo-link:active .logo{transform:translateY(0)}
  h1{font-size:40px;letter-spacing:-.5px;font-weight:800}
  p.sub{color:var(--muted);font-size:16px;margin:12px 0 36px}
  a.download{
    display:inline-block;background:var(--accent);color:#17130a;text-decoration:none;
    font-size:17px;font-weight:700;padding:15px 44px;border-radius:12px;
    box-shadow:0 8px 28px rgba(230,182,60,.38);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  a.download:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(230,182,60,.48)}
  a.download:active{transform:translateY(0)}
</style>
</head>
<body>
<main>
  <a class="logo-link" href="https://github.com/vtlinh/Poker-Stats" aria-label="Poker Pro on GitHub" title="View on GitHub">
    <svg class="logo" viewBox="0 0 96 96" role="img" aria-label="Poker Pro">
      <defs>
        <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1f8a45"/>
          <stop offset="1" stop-color="#0e4d25"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#felt)"/>
