<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#141c18" />
<title>Poker</title>
<meta name="description" content="Your chance to win big!" />
<style>
  :root{
    --bg:#141c18; --fg:#eaf1ed; --muted:#94a39b; --accent:#e6b63c;
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1100px 600px at 50% -10%, #23402e 0%, var(--bg) 60%);
    color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:24px;
  }
  main{text-align:center;max-width:460px}
  .logo{
    width:96px;height:96px;border-radius:24px;margin:0 auto 28px;display:block;
    box-shadow:0 12px 40px rgba(230,182,60,.32);
  }
  .head{display:flex;align-items:center;justify-content:center;gap:12px}
  h1{font-size:40px;letter-spacing:-.5px;font-weight:800}
  .gh{display:inline-flex;color:var(--muted);transition:color .15s ease}
  .gh:hover{color:var(--fg)}
  .gh svg{width:24px;height:24px;fill:currentColor;display:block}
  p.sub{color:var(--muted);font-size:16px;margin:12px 0 36px}
  a.download{
    display:inline-block;background:var(--accent);color:#17130a;text-decoration:none;
    font-size:17px;font-weight:700;padding:15px 44px;border-radius:12px;
    box-shadow:0 8px 28px rgba(230,182,60,.38);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  a.download:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(230,182,60,.48)}
  a.download:active{transform:translateY(0)}
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 96 96" role="img" aria-label="Poker">
    <defs>
      <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1f8a45"/>
        <stop offset="1" stop-color="#0e4d25"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#felt)"/>
    <path fill="#f7f7f2" d="M48 22 C39 33 26 41 26 54 C26 62.5 32 68 39.5 68 C43 68 45.4 66.8 47 64.6 C46.4 71 44.6 75.5 40 79 L56 79 C51.4 75.5 49.6 71 49 64.6 C50.6 66.8 53 68 56.5 68 C64 68 70 62.5 70 54 C70 41 57 33 48 22 Z"/>
  </svg>
  <div class="head">
    <h1>Poker</h1>
    <a class="gh" href="https://github.com/vtlinh/Poker-Stats" aria-label="View source on GitHub" title="View on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
  <p class="sub">Your chance to win big!</p>
  <a class="download" href="https://github.com/vtlinh/Poker-Stats/releases/latest/download/poker-odds.apk">Download APK</a>
</main>
</body>
</html>
