name: Release

# Tagless rolling release: every push to main rebuilds the signed APK and
# publishes it — together with a version.json manifest — to a single fixed
# GitHub release tagged "poker-latest", clobbering the previous assets. No git
# tags to create, no version bumps to remember. The in-app updater reads
# version.json and compares its integer versionCode against the installed build.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  release:
    name: Build signed APK & publish rolling release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: ver
        run: |
          MAJOR=$(( $(date -u +%Y) - 2025 ))
          [ "$MAJOR" -lt 0 ] && MAJOR=0
          WEEK=$(date -u +%V)
          NAME="${MAJOR}.${WEEK}.${GITHUB_RUN_NUMBER}"
          # Keep versionCode above older date-based installs (e.g. 130002).
          CODE=$(( 1000000 + GITHUB_RUN_NUMBER ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Publishing version $NAME (code $CODE)"

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add signing secrets to enable release builds."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK and version manifest
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/poker-odds.apk
          cat > dist/version.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}"
          }
          EOF

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the fixed release once; clobber its assets on every run after.
          if ! gh release view poker-latest >/dev/null 2>&1; then
            gh release create poker-latest \
              --title "Poker Pro (latest)" \
              --notes "Rolling release — always the newest signed build from main. Download poker-odds.apk below." \
              --latest
          fi
          gh release upload poker-latest dist/poker-odds.apk dist/version.json --clobber
